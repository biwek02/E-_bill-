<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Bill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}">E-Bill</a>
    {% if session.get('user_id') %}
      <div>
        <a class="btn btn-sm btn-outline-light me-2" href="{{ url_for('new_sale') }}">New Bill</a>
        <a class="btn btn-sm btn-outline-light me-2" href="{{ url_for('store_settings') }}">Store</a>
        <a class="btn btn-sm btn-warning" href="{{ url_for('logout') }}">Logout</a>
      </div>
    {% endif %}
  </div>
</nav>
<div class="container pb-5">
  {% with messages = get_flashed_messages() %}
    {% for message in messages %}
      <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
