
{% extends "base.html" %}
{% block content %}
<h2>Create New Bill</h2>

<form method="post" class="card card-body shadow-sm" id="sale-form">
  <h5>Customer</h5>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Name *</label>
      <input class="form-control" name="customer_name" required>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Phone</label>
      <input class="form-control" name="customer_phone">
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Email *</label>
      <input class="form-control" type="email" name="customer_email" required>
    </div>
  </div>

  <hr>
  <h5>Items</h5>
  <div id="items">
    <div class="row item-row mb-2">
      <div class="col-md-5">
        <input class="form-control" name="product_name" placeholder="Product" required>
      </div>
      <div class="col-md-2">
        <input class="form-control" type="number" min="0.01" step="0.01" name="quantity" placeholder="Qty" required>
      </div>
      <div class="col-md-3">
        <input class="form-control" type="number" min="0" step="0.01" name="unit_price" placeholder="Unit Price" required>
      </div>
      <div class="col-md-2">
        <button type="button" class="btn btn-outline-danger remove-item">Remove</button>
      </div>
    </div>
  </div>

  <button type="button" class="btn btn-outline-secondary mb-3" id="add-item">+ Add Item</button>

  <div class="row align-items-end">
    <div class="col-md-4 mb-3">
      <label class="form-label">Discount percentage</label>
      <div class="input-group">
        <input class="form-control" type="number" id="discount-preview" min="0" max="100" step="0.01" value="0">
        <span class="input-group-text">%</span>
        <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#discountModal">Set</button>
      </div>
      <input type="hidden" name="discount_percent" id="discount_percent" value="0">
      <small class="text-muted">Discount applies after 13% tax.</small>
    </div>

    <div class="col-md-4 mb-3">
      <label class="form-label">Tax</label>
      <input class="form-control" value="13% (automatic)" readonly>
      <small class="text-muted">Calculated on subtotal.</small>
    </div>

    <div class="col-md-4 mb-3">
      <label class="form-label">Payment Method *</label>
      <select class="form-select" name="payment_method" required>
        <option value="">Choose payment method</option>
        <option>Cash</option>
        <option>Credit Card</option>
        <option>Debit Card</option>
        <option>Bank Transfer</option>
        <option>Mobile Payment</option>
        <option>Other</option>
      </select>
    </div>
  </div>

  <div class="alert alert-info">
    After creating the bill, choose whether to print a 3.5-inch receipt or email the PDF bill to the customer.
  </div>
  <button class="btn btn-primary" type="submit">Create Bill</button>
</form>

<div class="modal fade" id="discountModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Set Discount Percentage</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <label for="discount-modal-value" class="form-label">Discount (0–100%)</label>
        <div class="input-group">
          <input class="form-control" id="discount-modal-value" type="number" min="0" max="100" step="0.01" value="0">
          <span class="input-group-text">%</span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="apply-discount" data-bs-dismiss="modal">Apply Discount</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const syncDiscount = value => {
  document.getElementById('discount-preview').value = value;
  document.getElementById('discount_percent').value = value;
  document.getElementById('discount-modal-value').value = value;
};

document.getElementById('discount-preview').addEventListener('input', e => {
  syncDiscount(e.target.value || 0);
});

document.getElementById('apply-discount').addEventListener('click', () => {
  let v = Number(document.getElementById('discount-modal-value').value || 0);
  if (v < 0 || v > 100) {
    alert('Enter a discount between 0 and 100%.');
    return;
  }
  syncDiscount(v);
});

document.getElementById('add-item').addEventListener('click', function() {
  const row = document.querySelector('.item-row').cloneNode(true);
  row.querySelectorAll('input').forEach(input => input.value = '');
  document.getElementById('items').appendChild(row);
});

document.addEventListener('click', function(e) {
  if (e.target.classList.contains('remove-item')) {
    const rows = document.querySelectorAll('.item-row');
    if (rows.length > 1) e.target.closest('.item-row').remove();
  }
});

document.getElementById('sale-form').addEventListener('submit', function() {
  syncDiscount(document.getElementById('discount-preview').value || 0);
});
</script>
{% endblock %}
