{% extends "base.html" %}
{% block content %}
<h2>Create E-Bill Store Account</h2>
<p class="text-muted">Fields marked * are required.</p>
<form method="post" class="card card-body shadow-sm">
<h5>Owner Account</h5>
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">Owner Name *</label><input class="form-control" name="owner_name" required></div>
<div class="col-md-6 mb-3"><label class="form-label">Username *</label><input class="form-control" name="username" required></div>
<div class="col-md-6 mb-3"><label class="form-label">Email *</label><input class="form-control" type="email" name="email" required></div>
<div class="col-md-6 mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
<div class="col-md-6 mb-3"><label class="form-label">Password *</label><input class="form-control" type="password" name="password" required></div>
</div>
<hr>
<h5>Store Information</h5>
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">Store Name *</label><input class="form-control" name="store_name" required></div>
<div class="col-md-6 mb-3"><label class="form-label">Store Phone</label><input class="form-control" name="store_phone"></div>
<div class="col-md-6 mb-3"><label class="form-label">Store Email</label><input class="form-control" type="email" name="store_email"></div>
<div class="col-md-6 mb-3"><label class="form-label">PAN</label><input class="form-control" name="pan"></div>
<div class="col-md-6 mb-3"><label class="form-label">Tax ID / VAT / GST</label><input class="form-control" name="tax_id"></div>
<div class="col-12 mb-3"><label class="form-label">Store Address</label><textarea class="form-control" name="address"></textarea></div>
</div>
<button class="btn btn-primary">Create Account</button>
</form>
{% endblock %}
